<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Gap Analysis - JobPilot AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1020 0%, #1a1f3a 100%);
            color: #eef2ff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        
        .back-btn {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
            transform: translateY(-2px);
        }
        
        .job-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .job-company {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        
        .match-score {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 2px solid #334155;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        
        .skill-item {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        
        .skill-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        
        .skill-item.present {
            border-color: #10b981;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .skill-item.missing {
            border-color: #ef4444;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .skill-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .skill-name {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        
        .recommendation-box {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
        }
        
        .recommendation-box h3 {
            font-size: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .recommendation-box p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #475569;
        }
        
        .btn-secondary:hover {
            border-color: #10b981;
            color: #10b981;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        @media(max-width: 768px) {
            .skills-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>
        
        <div class="header">
            <div id="jobInfo">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading Analysis...</h3>
                </div>
            </div>
        </div>
        
        <div id="analysisContent"></div>
    </div>
    
    <script>
        async function loadAnalysis() {
            const jobId = window.location.pathname.split('/')[2];
            
            try {
                // Get job data from jobs list
                const jobsResponse = await fetch('/api/jobs');
                const jobs = await jobsResponse.json();
                const jobData = jobs.find(j => j.id == jobId);
                
                if (!jobData) {
                    throw new Error('Job not found');
                }
                
                displayAnalysis(jobData);
            } catch (error) {
                document.getElementById('jobInfo').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Loading Analysis</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displayAnalysis(jobData) {
            const score = jobData.score || 0;
            
            document.getElementById('jobInfo').innerHTML = `
                <h1 class="job-title">${jobData.title}</h1>
                <div class="job-company">
                    <i class="fas fa-building"></i>
                    ${jobData.company}
                </div>
                <div class="job-company" style="margin-top: 8px;">
                    <i class="fas fa-map-marker-alt"></i>
                    ${jobData.location || 'Worldwide'}
                </div>
                <div class="match-score" style="margin-top: 16px;">
                    <i class="fas fa-chart-line"></i>
                    Match Score: ${Math.round(score)}%
                </div>
            `;
            
            // Get match level
            let matchLevel, matchColor, matchIcon, matchDescription;
            if (score >= 70) {
                matchLevel = 'Strong Match';
                matchColor = '#10b981';
                matchIcon = 'fa-star';
                matchDescription = 'This is an excellent match for your profile!';
            } else if (score >= 50) {
                matchLevel = 'Good Match';
                matchColor = '#3b82f6';
                matchIcon = 'fa-thumbs-up';
                matchDescription = 'This is a good match with room for growth.';
            } else if (score >= 30) {
                matchLevel = 'Moderate Match';
                matchColor = '#f59e0b';
                matchIcon = 'fa-info-circle';
                matchDescription = 'Some aspects match your profile.';
            } else {
                matchLevel = 'Lower Match';
                matchColor = '#ef4444';
                matchIcon = 'fa-exclamation-triangle';
                matchDescription = 'Limited alignment with your current profile.';
            }
            
            document.getElementById('analysisContent').innerHTML = `
                <div class="section" style="background: linear-gradient(135deg, ${matchColor}20 0%, ${matchColor}10 100%); border-color: ${matchColor}40;">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                        <div style="width: 80px; height: 80px; background: ${matchColor}; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 8px 20px ${matchColor}40;">
                            <i class="fas ${matchIcon}"></i>
                        </div>
                        <div>
                            <h2 style="font-size: 28px; margin-bottom: 8px; color: ${matchColor};">${matchLevel}</h2>
                            <p style="font-size: 16px; color: #94a3b8;">${matchDescription}</p>
                        </div>
                    </div>
                    
                    <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid ${matchColor}40;">
                        <h3 style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                            <i class="fas fa-lightbulb"></i>
                            Detailed Analysis
                        </h3>
                        <p style="line-height: 1.8; color: #e2e8f0;">
                            <strong>Score: ${Math.round(score)}%</strong><br><br>
                            
                            ${score >= 70 ? `
                                🎯 <strong>Excellent!</strong> Your profile shows strong alignment with this role.<br>
                                ✅ Your skills and experience in Embedded Systems, IoT, and Robotics match well.<br>
                                💡 <strong>Action:</strong> Review the full job description and apply with confidence!
                            ` : score >= 50 ? `
                                👍 <strong>Good match!</strong> You have relevant skills for this position.<br>
                                📚 There may be some areas where you can strengthen your expertise.<br>
                                💡 <strong>Action:</strong> Read the requirements carefully and highlight your matching experience in your application.
                            ` : score >= 30 ? `
                                📊 <strong>Moderate match.</strong> Some aspects align with your background.<br>
                                📖 This role might require skills you're still developing.<br>
                                💡 <strong>Action:</strong> Review if you meet the core requirements. Consider if this is a stretch opportunity you want to pursue.
                            ` : `
                                ⚠️ <strong>Lower match.</strong> This role may not be the best fit right now.<br>
                                🎓 Significant skill development might be needed.<br>
                                💡 <strong>Action:</strong> Review the job description to understand what skills to develop for similar roles in the future.
                            `}
                        </p>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">
                        <i class="fas fa-briefcase" style="color: #3b82f6;"></i>
                        About This Position
                    </h2>
                    
                    <div style="background: rgba(59, 130, 246, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2); margin-bottom: 20px;">
                        <h3 style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 18px;">
                            <i class="fas fa-building"></i>
                            ${jobData.company}
                        </h3>
                        <p style="color: #94a3b8; margin-bottom: 12px;">
                            <i class="fas fa-map-marker-alt"></i>
                            ${jobData.location || 'Remote / Worldwide'}
                        </p>
                        <p style="color: #94a3b8;">
                            <i class="fas fa-globe"></i>
                            Source: ${jobData.source || 'Remote Job Board'}
                        </p>
                    </div>
                    
                    <div style="background: rgba(16, 185, 129, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2);">
                        <h3 style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 18px;">
                            <i class="fas fa-user-circle"></i>
                            Your Profile Strengths
                        </h3>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;">
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> Python
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> C/C++
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> ESP32/Arduino
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> IoT & MQTT
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> Machine Learning
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> TensorFlow/Keras
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> Robotics
                            </span>
                            <span style="background: rgba(16, 185, 129, 0.2); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3);">
                                <i class="fas fa-check"></i> Embedded Systems
                            </span>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">
                        <i class="fas fa-compass" style="color: #f59e0b;"></i>
                        Next Steps
                    </h2>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;">
                        <div style="background: rgba(16, 185, 129, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2);">
                            <div style="font-size: 24px; margin-bottom: 12px;">
                                <i class="fas fa-file-alt" style="color: #10b981;"></i>
                            </div>
                            <h4 style="margin-bottom: 8px; font-size: 16px;">Read Full Description</h4>
                            <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
                                Review the complete job posting to understand all requirements and responsibilities.
                            </p>
                        </div>
                        
                        <div style="background: rgba(59, 130, 246, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2);">
                            <div style="font-size: 24px; margin-bottom: 12px;">
                                <i class="fas fa-edit" style="color: #3b82f6;"></i>
                            </div>
                            <h4 style="margin-bottom: 8px; font-size: 16px;">Tailor Your Application</h4>
                            <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
                                Customize your resume and cover letter to highlight relevant experience.
                            </p>
                        </div>
                        
                        <div style="background: rgba(245, 158, 11, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.2);">
                            <div style="font-size: 24px; margin-bottom: 12px;">
                                <i class="fas fa-paper-plane" style="color: #f59e0b;"></i>
                            </div>
                            <h4 style="margin-bottom: 8px; font-size: 16px;">Submit Application</h4>
                            <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
                                ${score >= 50 ? 'Apply with confidence!' : 'Consider if you meet core requirements before applying.'}
                            </p>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <a href="${jobData.url}" target="_blank" class="btn btn-primary">
                        <i class="fas fa-external-link-alt"></i>
                        View Full Job & Apply
                    </a>
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-home"></i>
                        Back to Dashboard
                    </a>
                </div>
            `;
        }
        
        loadAnalysis();
    </script>
</body>
</html>
