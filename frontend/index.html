<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JobPilot AI - Autonomous Job Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0b1020 0%, #1a1f3a 100%);
      color: #eef2ff;
      min-height: 100vh;
    }
    
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 2px solid #334155;
      padding: 24px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    
    .logo-text h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo-text p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    
    .status-badge {
      padding: 10px 20px;
      border-radius: 25px;
      background: linear-gradient(135deg, #153d2b 0%, #0f2419 100%);
      color: #7ff0a9;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #10b981;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    
    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 28px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #3b82f6);
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
      border-color: #10b981;
    }
    
    .stat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .stat-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #10b981;
    }
    
    .stat-label {
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      margin-top: 8px;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .jobs-section {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid #334155;
    }
    
    .section-title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .filter-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }
    
    .jobs-grid {
      display: grid;
      gap: 20px;
    }
    
    .job-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .job-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: linear-gradient(180deg, #10b981, #3b82f6);
    }
    
    .job-card:hover {
      transform: translateX(4px);
      border-color: #10b981;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 20px;
      gap: 20px;
    }
    
    .job-info h3 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .job-company {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 6px;
    }
    
    .job-location {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      font-size: 14px;
    }
    
    .score-badge {
      min-width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
      color: white;
      border: 4px solid #0f172a;
    }
    
    .score-badge span {
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
      opacity: 0.9;
    }
    
    .skills-section {
      margin: 20px 0;
    }
    
    .skills-label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .skill-tag {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #475569;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .skill-tag:hover {
      border-color: #10b981;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transform: translateY(-2px);
    }
    
    .skill-tag.missing {
      background: linear-gradient(135deg, #47252c 0%, #3d1f24 100%);
      color: #ffabb6;
      border-color: #ef4444;
    }
    
    .skill-tag.missing:hover {
      border-color: #ef4444;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    
    .job-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #334155;
    }
    
    .btn {
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      flex: 1;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      color: #94a3b8;
      border: 1px solid #475569;
    }
    
    .btn-secondary:hover {
      border-color: #10b981;
      color: #10b981;
      transform: translateY(-2px);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    
    .empty-state i {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    
    .empty-state h3 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    
    .empty-state p {
      font-size: 16px;
      line-height: 1.6;
    }
    
    .footer {
      text-align: center;
      padding: 32px;
      margin-top: 48px;
      border-top: 1px solid #334155;
      color: #64748b;
      font-size: 14px;
    }
    
    .footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    @media(max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr; }
      .job-header { flex-direction: column; }
      .score-badge { margin-bottom: 16px; }
      .logo-text h1 { font-size: 22px; }
      .header-content { flex-direction: column; gap: 16px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-rocket"></i>
        </div>
        <div class="logo-text">
          <h1>JobPilot AI</h1>
          <p>Autonomous Job Discovery & Matching</p>
        </div>
      </div>
      <div id="status" class="status-badge">
        <div class="pulse"></div>
        <span>Checking...</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-briefcase"></i>
          </div>
          <div class="stat-label">Total Jobs</div>
        </div>
        <div id="jobsCount" class="stat-value">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-star"></i>
          </div>
          <div class="stat-label">Strong Matches</div>
        </div>
        <div id="strongCount" class="stat-value">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-clock"></i>
          </div>
          <div class="stat-label">Scan Interval</div>
        </div>
        <div id="interval" class="stat-value">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <div class="stat-label">Auto Apply</div>
        </div>
        <div id="autoApply" class="stat-value">-</div>
      </div>
    </div>

    <div class="jobs-section">
      <div class="section-header">
        <h2 class="section-title">
          <i class="fas fa-fire"></i>
          Top Job Matches
        </h2>
        <div style="display: flex; gap: 12px;">
          <button class="filter-btn" onclick="scanJobs()" id="scanBtn">
            <i class="fas fa-sync"></i>
            Scan Jobs Now
          </button>
          <button class="filter-btn" onclick="window.open('/docs', '_blank')">
            <i class="fas fa-cog"></i>
            API Docs
          </button>
        </div>
      </div>
      <div id="jobs" class="jobs-grid">
        <div class="empty-state">
          <i class="fas fa-spinner fa-spin"></i>
          <h3>Loading Jobs...</h3>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>
        <i class="fas fa-rocket"></i> 
        <strong>JobPilot AI</strong> - Helping you find the perfect opportunity
      </p>
      <p style="margin-top: 8px;">
        Dashboard: <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a> • 
        <a href="/docs">API Documentation</a>
      </p>
    </div>
  </div>

  <script>
    async function getJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[c]));
    }

    async function load() {
      try {
        const health = await getJSON('/api/health');
        const jobs = await getJSON('/api/jobs');

        document.getElementById('status').innerHTML = `
          <div class="pulse"></div>
          <span>${health.status === 'running' ? '● Agent Online' : 'Offline'}</span>
        `;

        document.getElementById('jobsCount').textContent = jobs.length;
        document.getElementById('strongCount').textContent = jobs.filter(j => j.score >= 70).length;
        document.getElementById('interval').innerHTML = `${health.scan_interval_minutes}<span style="font-size:16px;color:#94a3b8;font-weight:400"> min</span>`;
        document.getElementById('autoApply').innerHTML = `<span style="color:${health.auto_apply ? '#10b981' : '#ef4444'}">${health.auto_apply ? 'ON' : 'OFF'}</span>`;

        const container = document.getElementById('jobs');

        if (!jobs.length) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-search"></i>
              <h3>No Jobs Yet</h3>
              <p>The worker will scan for jobs every ${health.scan_interval_minutes} minutes.<br>Check back soon!</p>
            </div>
          `;
          return;
        }

        container.innerHTML = jobs.map(j => `
          <div class="job-card">
            <div class="job-header">
              <div class="job-info">
                <h3>${escapeHtml(j.title)}</h3>
                <div class="job-company">
                  <i class="fas fa-building"></i>
                  ${escapeHtml(j.company)}
                </div>
                <div class="job-location">
                  <i class="fas fa-map-marker-alt"></i>
                  ${escapeHtml(j.location || 'Remote / Worldwide')}
                </div>
              </div>
              <div class="score-badge">
                ${j.score}%
                <span>MATCH</span>
              </div>
            </div>
            
            ${(j.present_skills && j.present_skills.length) ? `
              <div class="skills-section">
                <div class="skills-label"><i class="fas fa-check-circle"></i> Your Skills</div>
                <div class="skills-tags">
                  ${j.present_skills.slice(0, 6).map(s => `
                    <span class="skill-tag">
                      <i class="fas fa-check"></i>
                      ${escapeHtml(s)}
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            
            ${(j.missing_skills && j.missing_skills.length) ? `
              <div class="skills-section">
                <div class="skills-label"><i class="fas fa-exclamation-circle"></i> Missing Skills</div>
                <div class="skills-tags">
                  ${j.missing_skills.slice(0, 4).map(s => `
                    <span class="skill-tag missing">
                      <i class="fas fa-times"></i>
                      ${escapeHtml(s)}
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            
            <div class="job-actions">
              <a href="${j.url}" target="_blank" rel="noopener" class="btn btn-primary">
                <i class="fas fa-external-link-alt"></i>
                Apply Now
              </a>
              <button class="btn btn-secondary" onclick="window.location.href='/jobs/${j.id}/skill-analysis'">
                <i class="fas fa-chart-line"></i>
                Skill Analysis
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('jobs').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error Loading Jobs</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    async function scanJobs() {
      const btn = document.getElementById('scanBtn');
      const originalHTML = btn.innerHTML;
      
      try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning...';
        
        const response = await fetch('/api/scan-jobs', { method: 'POST' });
        const result = await response.json();
        
        if (result.success) {
          alert(`✅ Success!\n\nJobs found: ${result.jobs_found}\nNew matches: ${result.new_matches}\n\n${result.message}`);
          load(); // Reload the dashboard
        } else {
          alert(`❌ Error: ${result.error}`);
        }
      } catch (err) {
        alert(`❌ Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    load();
    setInterval(load, 60000); // Refresh every minute
  </script>
</body>
</html>
